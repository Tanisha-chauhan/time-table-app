        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: 'Poppins',sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
           overflow: hidden;
        }
        div{
            background-color: rgb(247, 214, 219);
            backdrop-filter: blur(20px);

            width: 30%;
            border-radius: 20px;

            text-align: center;
            transition: transform 0.3ms;
        }
        div:hover{
            transform:scale(1.02);
        }

        margin-bottom: 40px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

      box-shadow: 0 12px 24px rgba(255, 0, 102, 0.5);
       }
            
            button{

                height: 80px;

                margin: 15px auto;
                padding-top: 12px;
                padding-left: 29px;
                font-size: 32px;
                border: none;
                border-radius: 40px;
                background:linear-gradient(to right,#ed73bc,#7874ec);
                color: white;
                font-weight: bold;

                box-shadow: 0 4px 15px rgba(255,110,196,0.6);
                transition: all 0.3s ease;
            }
            .button:hover{
                background:linear-gradient(to right #7873f5,#ff6ec4);
                transform: scale(1.05);
                box-shadow: 0 6px 20px rgba(120,115,245,0.7);
            }

            height: 50px;
            width: 50px;
