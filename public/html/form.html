<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/form.css">
   </head>
</head>
<body>     
        <div class="form"> 
    <form id="lectureForm">
        <h1> Add Time Table Details</h1>
        <label for="lecture" >Lecture Number</label><br>
        <select id="Lecture" name="Lecture">
            <option value="Lecture 1">Lecture 1</option>
            <option value="Lecture 2">Lecture 2</option>
            <option value="Lecture 3">Lecture 3</option>
            <option value="Lecture 4">Lecture 4</option>
            <option value="Lecture 5">Lecture 5</option>
            <option value="Lecture 6">Lecture 6</option>
            <option value="Lecture 7">Lecture 7</option>
            <option value="Lecture 8">Lecture 8</option>
        </select><br><br>
        <label for="Subject" >Subject Name</label><br>
        <input type="text" id="Subject" placeholder="Subject"><br><br>
       <label for="TimeSlot">Select Time Slot</label><br>
       <select id="TimeSlot">
    <option value="">--Select Time Slot--</option>
    <option value="09:00-10:00">9:00 AM - 10:00 AM</option>
    <option value="10:00-11:00">10:00 AM - 11:00 AM</option>
    <option value="11:00-12:00">11:00 AM - 12:00 PM</option>
    <option value="12:00-13:00">12:00 PM - 1:00 PM</option>
    <option value="13:00-14:00">1:00 PM - 2:00 PM</option>
    <option value="14:00-15:00">2:00 PM - 3:00 PM</option>
    <option value="15:00-16:00">3:00 PM - 4:00 PM</option>
    <option value="16:00-17:00">4:00 PM - 5:00 PM</option>
       </select><br><br>
        <label for="Room" >Room Number</label><br>
        <input type="text" id="Room" placeholder="Room Number"><br><br>
         <label for="Day" >Day</label><br>
        <select id="Day" name="Day">
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday"> Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            </select><br><br>
             
<div4 class="div4">
        <button type="button" class="Cancel">Cancel</button>
        <button type="button" id="Save">Save</button>
        </div4>
    </form>
    </div>
<script src="../js/form.js"></script>

   
</body>
</html>
